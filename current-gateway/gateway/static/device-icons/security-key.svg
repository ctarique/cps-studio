<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 420 240"
     role="img"
     aria-labelledby="title desc">

  <title id="title">Security key</title>
  <desc id="desc">
    Generic hardware security key illustration.
  </desc>

  <defs>
    <linearGradient id="key-body"
                    x1="0"
                    y1="0"
                    x2="1"
                    y2="1">
      <stop offset="0%" stop-color="#3b3f43"/>
      <stop offset="52%" stop-color="#202326"/>
      <stop offset="100%" stop-color="#101214"/>
    </linearGradient>

    <linearGradient id="key-metal"
                    x1="0"
                    y1="0"
                    x2="1"
                    y2="1">
      <stop offset="0%" stop-color="#f4f5f6"/>
      <stop offset="48%" stop-color="#c7cbd0"/>
      <stop offset="100%" stop-color="#8f959b"/>
    </linearGradient>

    <filter id="key-shadow"
            x="-20%"
            y="-20%"
            width="140%"
            height="160%">
      <feDropShadow dx="0"
                    dy="10"
                    stdDeviation="10"
                    flood-color="#000000"
                    flood-opacity=".16"/>
    </filter>
  </defs>

  <g filter="url(#key-shadow)">

    <!-- USB connector -->
    <path d="
      M 45 82
      L 122 82
      L 122 158
      L 45 158
      C 32 158 24 149 24 137
      L 24 103
      C 24 91 32 82 45 82
      Z"
      fill="url(#key-metal)"
      stroke="#202326"
      stroke-width="5"/>

    <rect x="45"
          y="97"
          width="45"
          height="9"
          rx="3"
          fill="#555b61"/>

    <rect x="45"
          y="134"
          width="45"
          height="9"
          rx="3"
          fill="#555b61"/>

    <!-- Main body -->
    <path d="
      M 105 52
      L 326 52
      C 354 52 376 74 376 102
      L 376 138
      C 376 166 354 188 326 188
      L 105 188
      C 88 188 76 176 76 159
      L 76 81
      C 76 64 88 52 105 52
      Z"
      fill="url(#key-body)"
      stroke="#090a0b"
      stroke-width="6"/>

    <!-- top highlight -->
    <path d="
      M 107 66
      L 321 66
      C 338 66 349 76 355 89"
      fill="none"
      stroke="rgba(255,255,255,.20)"
      stroke-width="5"
      stroke-linecap="round"/>

    <!-- touch/contact ring -->
    <circle cx="264"
            cy="120"
            r="39"
            fill="#151719"
            stroke="#d9dee5"
            stroke-width="6"/>

    <circle cx="264"
            cy="120"
            r="25"
            fill="#2e3236"
            stroke="#737a81"
            stroke-width="3"/>

    <circle cx="264"
            cy="120"
            r="9"
            fill="#a5243d"/>

    <!-- keyhole / lanyard hole -->
    <circle cx="337"
            cy="120"
            r="18"
            fill="#f7f8f9"
            stroke="#7a8086"
            stroke-width="5"/>

    <circle cx="337"
            cy="120"
            r="8"
            fill="#202326"/>

    <!-- Sentinel accent -->
    <rect x="115"
          y="111"
          width="64"
          height="8"
          rx="4"
          fill="#a5243d"/>

  </g>
</svg>
